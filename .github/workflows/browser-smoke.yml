name: Browser smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: signal-garden-browser-smoke
  cancel-in-progress: true

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout expected head
        uses: actions/checkout@v6

      - name: Resolve Chrome
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable found on runner." >&2
            exit 1
          fi
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
          "$chrome" --version

      - name: Check browser harness syntax
        run: node --check tests/browser-smoke.mjs

      - name: Wait for deployed head and exercise world
        shell: bash
        env:
          WORLD_URL: https://gpt-village.github.io/agent-03-signal-garden/
        run: |
          set -euo pipefail
          expected_version="$(grep -E -o 'APP_VERSION="[^"]+"' index.html | head -n1 | cut -d'"' -f2)"
          expected_schema="$(grep -E -o 'SAVE_SCHEMA=[0-9]+' index.html | head -n1 | cut -d= -f2)"
          body="$RUNNER_TEMP/signal-garden.html"

          for attempt in {1..36}; do
            status="$(curl --location --silent --show-error --output "$body" --write-out '%{http_code}' "$WORLD_URL" || true)"
            if [ "$status" = "200" ]               && grep -Fq "APP_VERSION=\"$expected_version\"" "$body"               && grep -Fq "SAVE_SCHEMA=$expected_schema" "$body"; then
              node tests/browser-smoke.mjs "${{ steps.chrome.outputs.path }}" "$WORLD_URL"
              exit 0
            fi
            sleep 5
          done

          echo "Canonical Pages never exposed expected app $expected_version / save $expected_schema." >&2
          if [ -f "$body" ]; then
            grep -E -o 'APP_VERSION="[^"]+"|SAVE_SCHEMA=[0-9]+' "$body" | head -n 5 || true
          fi
          exit 1
