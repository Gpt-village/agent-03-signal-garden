name: Browser smoke

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/browser-smoke.mjs"
      - ".github/workflows/browser-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout expected head
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Detect superseded head
        id: freshness
        shell: bash
        run: |
          set -euo pipefail
          current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo "superseded=true" >> "$GITHUB_OUTPUT"
            echo "Skipping browser smoke: $GITHUB_SHA was superseded by $current before browser execution." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve Chrome
        if: ${{ steps.freshness.outputs.superseded != 'true' }}
        id: chrome
        shell: bash
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable found on runner." >&2
            exit 1
          fi
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
          "$chrome" --version

      - name: Check browser harness syntax
        if: ${{ steps.freshness.outputs.superseded != 'true' }}
        run: node --check tests/browser-smoke.mjs

      - name: Wait for deployed head and exercise world
        if: ${{ steps.freshness.outputs.superseded != 'true' }}
        shell: bash
        env:
          WORLD_URL: https://gpt-village.github.io/agent-03-signal-garden/
        run: |
          set -euo pipefail
          expected_version="$(grep -E -o 'APP_VERSION="[^"]+"' index.html | head -n1 | cut -d'"' -f2)"
          expected_schema="$(grep -E -o 'SAVE_SCHEMA=[0-9]+' index.html | head -n1 | cut -d= -f2)"
          expected_hash="$(sha256sum index.html | awk '{print $1}')"
          body="$RUNNER_TEMP/signal-garden.html"

          for attempt in {1..36}; do
            current="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            if [ "$current" != "$GITHUB_SHA" ]; then
              echo "Head became superseded while waiting for Pages; ending this obsolete browser run cleanly." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi

            status="$(curl --location --silent --show-error --output "$body" --write-out '%{http_code}' "$WORLD_URL" || true)"
            deployed_hash="$(sha256sum "$body" | awk '{print $1}')"
            if [ "$status" = "200" ] \
              && [ "$deployed_hash" = "$expected_hash" ] \
              && grep -Fq "APP_VERSION=\"$expected_version\"" "$body" \
              && grep -Fq "SAVE_SCHEMA=$expected_schema" "$body"; then
              echo "Exact deployed index fingerprint: $deployed_hash" >> "$GITHUB_STEP_SUMMARY"
              node tests/browser-smoke.mjs "${{ steps.chrome.outputs.path }}" "$WORLD_URL"
              exit 0
            fi
            sleep 5
          done

          echo "Canonical Pages never exposed the exact current index (app $expected_version / save $expected_schema)." >&2
          echo "Expected SHA-256: $expected_hash" >&2
          if [ -f "$body" ]; then
            echo "Observed SHA-256: $(sha256sum "$body" | awk '{print $1}')" >&2
            grep -E -o 'APP_VERSION="[^"]+"|SAVE_SCHEMA=[0-9]+' "$body" | head -n 5 || true
          fi
          exit 1
