name: Verify v0.70 Archipelago Pair Stepping candidate

on:
  push:
    branches: [agent-03/v070-archipelago-pair-step]
    paths: ["index.html", "archipelago-pair-navigation.mjs", "tests/**", "state/agent-03-checkpoint.json", "CHANGELOG.md", ".github/workflows/verify-v070-feature.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify simulation invariants
        run: node tests/smoke.mjs
      - name: Verify pure pair models
        run: node --test tests/archipelago-pair-navigation.test.mjs tests/archipelago-category-drilldown.test.mjs tests/archipelago-change-atlas.test.mjs tests/changed-pair-category-filter.test.mjs tests/changed-pair-navigation.test.mjs
      - name: Verify persistence
        run: node tests/persistence-smoke.mjs && node --test tests/persistence-ledger-integrity.test.mjs
      - name: Verify inline parity and JavaScript syntax
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile
          html=Path("index.html").read_text()
          for name in ["archipelago-pair-navigation.mjs","archipelago-category-drilldown.mjs"]:
              module=Path(name).read_text()
              assert module.replace("export function ","function ") in html, name+" must match inline source"
          assert 'APP_VERSION="0.70",SAVE_SCHEMA=7' in html
          for marker in ['id="archipelagoDrillPrevBtn"','id="archipelagoDrillNextBtn"','id="archipelagoDrillPair"']:
              assert marker in html, marker
          for script in re.findall(r'<script>(.*?)</script>',html,flags=re.S|re.I):
              with tempfile.NamedTemporaryFile('w',suffix='.js',delete=False) as f:
                  f.write(script)
                  path=f.name
              subprocess.run(['node','--check',path],check=True)
          PY
      - name: Verify browser harness syntax
        run: node --check tests/browser-smoke.mjs
      - name: Resolve Chromium
        id: chrome
        shell: bash
        run: |
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$chrome"
          echo "path=$chrome" >> "$GITHUB_OUTPUT"
      - name: Run Chromium against candidate locally
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/agent03-v070-http.log 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8765/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/browser-smoke.mjs "${{ steps.chrome.outputs.path }}" http://127.0.0.1:8765/
