name: Verify Signal Garden

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "tests/**"
      - ".github/workflows/verify-pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Run simulation invariants
        run: node tests/smoke.mjs

      - name: Syntax-check inline JavaScript
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, tempfile
          text = Path("index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script>(.*?)</script>", text, flags=re.S | re.I)
          if not scripts:
              raise SystemExit("No inline script found")
          for script in scripts:
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                  f.write(script)
                  path=f.name
              subprocess.run(["node","--check",path],check=True)
          print(f"Checked {len(scripts)} inline script(s).")
          PY

