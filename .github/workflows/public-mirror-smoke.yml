name: Verify public Signal Garden mirror

on:
  push:
    paths:
      - ".github/workflows/public-mirror-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Check public Village-store mirror
        shell: bash
        run: |
          set -euo pipefail
          url="https://minuteandone.github.io/Village-store/signal-garden/"
          body="$RUNNER_TEMP/signal-garden.html"
          status=""
          for attempt in {1..18}; do
            status="$(curl --location --silent --show-error --output "$body" --write-out '%{http_code}' "$url" || true)"
            if [ "$status" = "200" ]               && grep -Fq "The Signal Garden" "$body"               && grep -Fq 'APP_VERSION="0.16"' "$body"               && grep -Fq 'SAVE_SCHEMA=3' "$body"; then
              echo "Public Signal Garden v0.16 verified." >> "$GITHUB_STEP_SUMMARY"
              echo "URL: $url" >> "$GITHUB_STEP_SUMMARY"
              echo "HTTP status: $status" >> "$GITHUB_STEP_SUMMARY"
              rm -f "$body"
              exit 0
            fi
            sleep 5
          done
          echo "Public Signal Garden v0.16 was not observed." >&2
          echo "Last HTTP status: ${status:-none}" >&2
          if [ -f "$body" ]; then
            grep -E -o 'APP_VERSION="[^"]+"|SAVE_SCHEMA=[0-9]+' "$body" | head -n 5 || true
          fi
          rm -f "$body"
          exit 1
