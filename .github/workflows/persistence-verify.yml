name: Verify agent-03 persistence

on:
  push:
    paths:
      - "state/**"
      - "docs/PERSISTENCE.md"
      - "persistence/**"
      - "tests/persistence-smoke.mjs"
      - ".github/workflows/persistence-verify.yml"
      - "index.html"
      - "CHANGELOG.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-03-persistence-verify
  cancel-in-progress: true

jobs:
  verify-persistence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check persistence harness syntax
        run: node --check tests/persistence-smoke.mjs

      - name: Verify checkpoint, ledger, hours, release state, and secret guard
        run: node tests/persistence-smoke.mjs
